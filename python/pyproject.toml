[project]
name = "tenantflow"
version = "0.0.0"
description = "Tenant isolation for AI agents on shared infrastructure: Cedar per-call checks plus an information-flow monitor."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "cedarpy>=4.12.1",
]

[project.scripts]
tenantflow = "tenantflow.cli:main"

[project.optional-dependencies]
fides = ["agent-framework-core==1.5.0"]
mcp = [
    "mcp>=2.3,<3",  # uses the 2.x server API (Server(on_call_tool=...), MCPServer)
]

[dependency-groups]
bench = [
    "matplotlib>=3.11.2",
]
dev = [
    "hypothesis>=6.168.5",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tenantflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
